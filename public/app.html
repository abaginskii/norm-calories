<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Норма — дневник калорий</title>
<meta name="description" content="Норма — простой дневник калорий и БЖУ. Считает норму, помогает вести питание и вес. Работает офлайн, ставится на телефон как приложение.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#d6e6cf">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://world.openfoodfacts.org" crossorigin>
<link rel="preconnect" href="https://generativelanguage.googleapis.com" crossorigin>
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="icons/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Норма">
<link rel="stylesheet" href="styles.css">
<script>
  // Apply the saved theme before first paint to avoid a flash.
  try {
    var s = JSON.parse(localStorage.getItem('norm.state.v1') || 'null');
    var t = s && s.settings && s.settings.theme || 'auto';
    var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  } catch (e) {}
</script>
</head>
<body>
  <div class="app">
    <header id="topbar" class="topbar" hidden></header>
    <main id="view" class="view" aria-live="polite"></main>
    <nav id="tabbar" class="tabbar" hidden></nav>
  </div>
  <div id="sheet-root"></div>
  <div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>
  <noscript>
    <p style="padding:24px;font:16px/1.5 system-ui">Для работы приложения нужен JavaScript.</p>
  </noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
