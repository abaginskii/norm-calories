<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Норма переехала</title>
<meta name="robots" content="noindex">
<style>
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #EEF2E6; color: #1C2419; font: 17px/1.55 -apple-system, 'Segoe UI', Roboto, sans-serif; }
  main { max-width: 440px; padding: 32px 20px; }
  h1 { font-size: 34px; line-height: 1.1; letter-spacing: -.03em; margin: 0 0 14px; }
  p { color: #5D6A59; margin: 0 0 24px; }
  a.btn { display: flex; justify-content: center; align-items: center; min-height: 56px; border-radius: 99px; background: #D9FF86; color: #1F4A30; box-shadow: inset 0 0 0 1.5px #1F4A30; font-weight: 700; text-decoration: none; }
  small { display: block; margin-top: 16px; color: #5D6A59; }
</style>
</head>
<body>
<main>
  <h1>Норма переехала</h1>
  <p id="text">Новый адрес: norma-orvo.vercel.app. Там же вход через orvo ID и облако.</p>
  <a class="btn" id="go" href="https://norma-orvo.vercel.app/app">Открыть Норму</a>
  <small id="note"></small>
</main>
<script>
  // Дневник лежал в браузере на этом адресе. Переносим его в ссылке после «#»:
  // эта часть не уходит на сервер, её читает только новая Норма на вашем устройстве.
  var NEW = 'https://norma-orvo.vercel.app/app';
  try {
    var raw = localStorage.getItem('norm.state.v1');
    var s = raw && JSON.parse(raw);
    if (s && s.profile) {
      delete s.ai; delete s.barcodeCache;
      var data = btoa(unescape(encodeURIComponent(JSON.stringify(s))));
      document.getElementById('text').textContent = 'Норма теперь живёт на norma-orvo.vercel.app. Ваш дневник с этого устройства переедет вместе с ней.';
      document.getElementById('go').textContent = 'Перенести дневник';
      document.getElementById('go').href = NEW + '#import=' + data;
      document.getElementById('note').textContent = 'Ключ Gemini не переносится: на новом адресе ИИ работает через orvo ID.';
    } else {
      location.replace(NEW);
    }
  } catch (e) {}
</script>
</body>
</html>
